name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual escape hatch, mirroring tests.yml. GitHub restricts workflow_dispatch to
  # collaborators with write access, so only maintainers can fire it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    # PSScriptAnalyzer is parse-based static analysis - it never runs the code under
    # review - so Windows-targeted scripts lint identically on Linux, and the ubuntu
    # runners spin up and execute noticeably faster than windows-latest.
    runs-on: ubuntu-latest
    # Starts non-blocking so style findings don't block merges while the tree is
    # brought into compliance. Flip `continue-on-error` off (and add it to the
    # ruleset's required checks) once it is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      # The runner images ship PSScriptAnalyzer in-box, so installing it from PSGallery
      # every run wasted ~26s. This only installs if the image ever stops bundling it.
      - name: Ensure PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-PSResource -Name PSScriptAnalyzer -TrustRepository -Scope CurrentUser -Quiet
          }

      # `-Settings` points at the same PSScriptAnalyzerSettings.psd1 VS Code uses, so CI
      # reports exactly what the Problems panel shows locally instead of a hand-copied
      # subset of its excludes. It also keeps PSUseCorrectCasing out of the run, the rule
      # PSScriptAnalyzer's own bug tracker pins the intermittent "Collection was modified;
      # enumeration operation may not execute" crash on: Invoke-ScriptAnalyzer analyzes
      # files in parallel while the rules share one command-info cache, and on a ~900-file
      # tree that race still fires now and then (PowerShell/PSScriptAnalyzer#1516, #902).
      # The retry below absorbs a residual hit of that one exception; anything else throws
      # on the first attempt as before.
      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $settings = "$env:GITHUB_WORKSPACE/PSScriptAnalyzerSettings.psd1"
          $target   = "$env:GITHUB_WORKSPACE/Windows/PowerShell"
          $results  = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              $results = Invoke-ScriptAnalyzer -Path $target -Recurse -Settings $settings -ErrorAction Stop
              break
            } catch [System.InvalidOperationException] {
              if ($attempt -eq 3 -or $_.Exception.Message -notmatch 'Collection was modified') { throw }
              Write-Host "::warning::PSScriptAnalyzer hit its known parallel-analysis race (attempt $attempt/3), retrying..."
            }
          }
          $results | Format-Table -AutoSize
          foreach ($r in $results) {
            $lvl = if ($r.Severity -eq 'Error') { 'error' } else { 'warning' }
            Write-Host "::$lvl file=$($r.ScriptPath),line=$($r.Line),col=$($r.Column)::$($r.RuleName): $($r.Message)"
          }
          if (($results | Where-Object Severity -eq 'Error').Count -gt 0) { exit 1 }
