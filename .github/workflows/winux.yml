# WinuX: the Pester suite on Windows. The file is named after the project so it never collides
# with another upstream's workflows in a fork that merges several (foundation.yml is Foundation's).
name: WinuX

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual escape hatch for when GitHub drops the push/pull_request event and the run
  # is never created, leaving a required check stuck on "Expected - waiting for status
  # to be reported". GitHub restricts workflow_dispatch to collaborators with write
  # access, so only maintainers can fire it.
  workflow_dispatch:

# Cancel superseded runs on the same ref (saves Windows minutes).
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write          # dorny/test-reporter creates a Check Run
  pull-requests: write   # annotations / check summary on PRs

jobs:
  test:
    name: Pester Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The selector audit (below) diffs against the PR's base or the pushed range, so it needs
          # the history. Blobless: commits and trees only, file contents fetched on demand.
          fetch-depth: 0
          filter: blob:none

      # The pinned version lives in one file the harness and Install-PowerShellModules also
      # read, so CI can never disagree with a local run. Bump it there, deliberately.
      - name: Resolve pinned Pester version
        shell: pwsh
        run: '"PESTER_VERSION=$((Get-Content Windows/PowerShell/Modules/Tests/RequiredPesterVersion.txt).Trim())" >> $env:GITHUB_ENV'

      # windows-latest ships Pester 3.4.0 in-box, so the pinned version has to be installed.
      # Pulling it from PSGallery on every run cost ~29s; the cache turns that into a few seconds.
      - name: Cache Pester
        id: cache-pester
        uses: actions/cache@v5
        with:
          path: ~\Documents\PowerShell\Modules\Pester
          key: pester-${{ runner.os }}-${{ env.PESTER_VERSION }}

      - name: Install Pester
        if: steps.cache-pester.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # PSResourceGet ships in-box with the pwsh on windows-latest and is markedly faster
          # than PowerShellGet; fall back to Install-Module if the image ever lacks it.
          if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
            Install-PSResource -Name Pester -Version "[$env:PESTER_VERSION]" -TrustRepository -Scope CurrentUser -Quiet
          }
          else {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name Pester -RequiredVersion $env:PESTER_VERSION -Force -SkipPublisherCheck -Scope CurrentUser
          }

      # The harness is the same one Run-Tests uses locally: it bootstraps each worker session
      # itself (PSModulePath, $global:Configuration, module imports), so this step no longer
      # carries an inline copy of that bootstrap that could drift from the local one.
      # The full suite always runs here. -Since only adds the selector audit: the harness also works
      # out what Run-Tests -Changed would have selected for this diff and reports every failing file
      # outside that selection as a selector miss (a warning annotation and a run-log line), so the
      # selector's miss rate is measured rather than assumed. No base (a manual run, a new branch's
      # all-zero "before") means no audit.
      - name: Run Pester
        shell: pwsh
        env:
          SELECTOR_SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          $harness = @{ CI = $true }
          if ($env:SELECTOR_SINCE -and $env:SELECTOR_SINCE -notmatch '^0+$') { $harness.Since = $env:SELECTOR_SINCE }
          & "$env:GITHUB_WORKSPACE/Windows/PowerShell/Modules/Tests/Invoke-TestSuite.ps1" @harness
          exit $LASTEXITCODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pester-results
          path: |
            Windows/PowerShell/Modules/Tests/Results/pester-results-*.xml
            Windows/PowerShell/Modules/Tests/Results/TestRun_*.log
          if-no-files-found: error

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Pester Results
          path: Windows/PowerShell/Modules/Tests/Results/pester-results-*.xml   # one XML per worker, merged into a single check run
          reporter: dotnet-nunit       # matches Pester's NUnit3 output schema
          fail-on-error: true

  # The mirror contract: every mirror line of Windows/PowerShell/Upstream.conf names a file the sibling upstream ships with
  # the same bytes. A drift is reported here, at the pull request, as a warning per file (both
  # sides of a coordinated change cannot both be merged first, so it never fails the run). Runs
  # only in the repository the manifest's url names; a fork's mirror files are its own.
  mirror:
    name: Mirror contract
    runs-on: ubuntu-latest
    env:
      SIBLING: IvanPavlak/Foundation
    steps:
      - uses: actions/checkout@v5
      - name: Compare the mirror files with Foundation
        shell: bash
        run: |
          manifest=Windows/PowerShell/Upstream.conf
          home=$(awk '$1 == "url" { print $2; exit }' "$manifest" | sed -E 's#^https?://[^/]*github\.com/##; s#\.git$##' | tr '[:upper:]' '[:lower:]')
          if [ "$home" != "$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "Not $home - the mirror contract is checked only in the upstream itself."
            exit 0
          fi
          drift=0
          for path in $(awk '$1 == "mirror" { print $2 }' "$manifest"); do
            if ! curl -fsSL "https://raw.githubusercontent.com/$SIBLING/master/$path" -o "$RUNNER_TEMP/sibling"; then
              echo "::warning file=$path::$SIBLING does not ship the mirror file $path"
              drift=1
            elif ! cmp -s "$RUNNER_TEMP/sibling" "$path"; then
              echo "::warning file=$path::$path differs from $SIBLING's copy - the mirror contract says both upstreams ship the same bytes"
              drift=1
            fi
          done
          [ "$drift" -eq 0 ] && echo "Every mirror file matches $SIBLING."
          exit 0
