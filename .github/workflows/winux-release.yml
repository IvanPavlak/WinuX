name: WinuX Release

# Tags a WinuX release from its changelog, so nothing is tagged by hand (Windows/VERSIONING.md).
#
# On every push to master it reads the newest "## [x.y.z]" heading of Windows/CHANGELOG.md. When the
# tag winux/vX.Y.Z does not exist yet it creates it, annotated, on the pushed commit and calls
# release.yml for it (a tag pushed with GITHUB_TOKEN starts no workflow of its own), which builds
# WinuX.exe and publishes the release with that changelog section as its body. A merge that only
# touched [Unreleased] finds its newest version already tagged and does nothing.
#
# It runs only in the repository the url line of Windows/PowerShell/Upstream.conf names, so the same
# file inside a fork that merges WinuX never tags the fork.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: winux-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Tag the release
    # Never in a private repository, where no Actions minutes are spent (a fork is never tagged).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create the tag when the changelog has a new release
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          manifest=Windows/PowerShell/Upstream.conf
          url=$(awk '$1 == "url" { print $2; exit }' "$manifest")
          prefix=$(awk '$1 == "tag-prefix" { print $2; exit }' "$manifest")
          changelog=$(awk '$1 == "changelog" { print $2; exit }' "$manifest")
          home=$(printf '%s' "$url" | sed -E 's#^https?://[^/]*github\.com/##; s#\.git$##; s#/$##' | tr '[:upper:]' '[:lower:]')
          here=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          if [ "$home" != "$here" ]; then
            echo "This is $GITHUB_REPOSITORY, not $home (the manifest's url) - a fork is never tagged here."
            exit 0
          fi
          version=$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+[^]]*)\].*/\1/p' "$changelog" | head -n 1)
          if [ -z "$version" ]; then
            echo "$changelog has no released version yet - nothing to tag."
            exit 0
          fi
          tag="$prefix/v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag exists - the newest release is already tagged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Tagged $tag on $GITHUB_SHA."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
