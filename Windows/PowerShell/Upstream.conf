# Upstream manifest - what WinuX ships and where it lives, read by Merge-Upstreams in any fork.
#
# A fork can merge several upstreams (WinuX for Windows, Foundation for the Mac). Each one ships a
# manifest like this one; Merge-Upstreams NAME reads the manifest named NAME as the upstream has it
# and handles every path the merge changes by exactly one rule:
#
#   own PATH      WinuX's rooms: always taken from WinuX
#   mirror PATH   identical in every upstream by contract: taken from whichever upstream merges
#   anything else the hallway: taken only when the fork's root owner is WinuX, put back as the
#                 fork has it otherwise (listed, never silently dropped)
#
# A PATH ending in / is a folder and covers everything under it; any other PATH is one file. The
# mirror list is the same in every upstream's manifest. Plain KEY VALUE lines; no machine types and
# no local overlay - a fork's own choices (root-owner, take) go in Git/upstreams.local.conf.
# See docs/winux/contributing/fork-model.md.

name        winux
url         https://github.com/IvanPavlak/WinuX.git
tag-prefix  winux
changelog   Windows/CHANGELOG.md

own         Windows/
own         docs/winux/
own         .github/workflows/winux.yml
own         .github/workflows/winux-release.yml
own         .github/workflows/lint.yml
own         .github/workflows/release.yml
own         AI/Context/REPOSITORY_CONTEXT.md
own         AI/Context/WINDOWS_CONTEXT.md
own         AI/Instructions/ConfigurationPatterns.md
own         AI/Instructions/ContextBudgeting.md
own         AI/Instructions/PowerShellConventions.md
own         AI/Skills/winux/
own         FastFetch/Windows/
own         JetBrainsMonoNerdFont/
own         PSScriptAnalyzerSettings.psd1

mirror      LICENSE
mirror      CODE_OF_CONDUCT.md
mirror      Git/.gitconfig
mirror      Oh-My-Posh/WinuX_Test.omp.json
mirror      Wallpapers/Black.jpg
mirror      Wallpapers/White.png
mirror      LazyGit/config.yml
mirror      LazyDocker/config.yml
mirror      Docker/docker-compose.postgresql.yml
mirror      NuGet/nuget.config
mirror      Firefox/user.js
mirror      AI/Instructions/DocumentationStyle.md
mirror      AI/Instructions/OutputFormatting.md
mirror      AI/Rules/example/CoreAiRules/RULES.md
mirror      AI/Hooks/ai-ownership-guard.sh
mirror      AI/Hooks/ai-repository-policy.sh
mirror      Backups/.gitkeep
